[package]
name = "forge-ai"
version = "0.1.0"
edition = "2021"
description = "AI provider configuration for Doc Forge: catalog, private credentials file, model discovery, connection tests."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["net", "time", "io-util", "sync"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
similar = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync"] }
tempfile = "3"
