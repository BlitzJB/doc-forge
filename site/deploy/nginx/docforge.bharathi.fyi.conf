# docforge.bharathi.fyi: the Doc Forge landing page. Static files only, no app process.
# Managed from doc-forge/site/deploy/ (deploy.sh). Releases live in /var/www/docforge/releases.

server {
    listen 80;
    listen [::]:80;
    server_name docforge.bharathi.fyi;
    include /etc/nginx/snippets/learn-cloudflare.conf;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name docforge.bharathi.fyi;

    ssl_certificate     /etc/letsencrypt/live/docforge.bharathi.fyi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docforge.bharathi.fyi/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Only Cloudflare may reach this vhost (shared gate with learn.bharathi.fyi);
    # the real client IP is restored from CF-Connecting-IP for logs and limits.
    include /etc/nginx/snippets/learn-cloudflare.conf;

    root /var/www/docforge/current;
    index index.html;
    server_tokens off;
    autoindex off;
    charset utf-8;
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;
    access_log /var/log/nginx/docforge.access.log;
    error_log  /var/log/nginx/docforge.error.log warn;

    limit_req  zone=docforge_req burst=40 nodelay;
    limit_conn docforge_conn 20;
    limit_req_status 429;
    limit_conn_status 429;

    # Read-only site.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # add_header in a location replaces the server-level set, so every location
    # includes the same header snippet.
    include /etc/nginx/snippets/docforge-headers.conf;

    location ~ /\. { return 404; }

    location = / {
        include /etc/nginx/snippets/docforge-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location ~ ^/(styles\.css|main\.js)$ {
        include /etc/nginx/snippets/docforge-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # Font files are named by content, so they never change.
    location /assets/fonts/ {
        include /etc/nginx/snippets/docforge-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/docforge-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location = /downloads/Doc-Forge.dmg {
        include /etc/nginx/snippets/docforge-headers.conf;
        limit_conn docforge_conn 3;
        types { }
        default_type application/x-apple-diskimage;
        add_header Content-Disposition 'attachment; filename="Doc-Forge.dmg"' always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /downloads/Doc-Forge.dmg.sha256 {
        include /etc/nginx/snippets/docforge-headers.conf;
        types { }
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Nothing else is served: no listings, no stray files.
    location / {
        return 404;
    }
}
